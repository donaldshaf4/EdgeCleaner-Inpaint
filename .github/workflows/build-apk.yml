name: Build EdgeCleaner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q EdgeCleaner-Inpaint-repo.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Build debug APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeCleaner-Inpaint-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
