name: Build EdgeCleaner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unpack project
        run: |
          rm -rf project
          mkdir project
          unzip -q EdgeCleaner-Inpaint-repo.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Prepare version and signing
        id: prepare
        run: |
          echo "version_code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "version_name=4.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/project/release-key.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed RELEASE APK
        if: steps.prepare.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/project/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: edgecleaner
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p project :app:assembleRelease \
            -PversionCode=${{ steps.prepare.outputs.version_code }} \
            -PversionName=${{ steps.prepare.outputs.version_name }} \
            --stacktrace

      - name: Upload signed RELEASE APK
        if: steps.prepare.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EdgeCleaner-Inpaint-RELEASE
          path: project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build DEBUG APK (signing secrets not configured)
        if: steps.prepare.outputs.signed != 'true'
        run: |
          echo "::warning::Release signing secrets are not configured. Building DEBUG APK only."
          gradle -p project :app:assembleDebug \
            -PversionCode=${{ steps.prepare.outputs.version_code }} \
            -PversionName=${{ steps.prepare.outputs.version_name }} \
            --stacktrace

      - name: Upload DEBUG APK
        if: steps.prepare.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EdgeCleaner-Inpaint-DEBUG-NOT-FOR-UPDATES
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
